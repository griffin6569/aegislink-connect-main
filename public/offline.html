<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AegisLink Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #11344f 0%, #08111f 55%, #030712 100%);
        color: #eff6ff;
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(92vw, 420px);
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        background: rgba(7, 15, 28, 0.88);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      p {
        margin: 0 0 10px;
        line-height: 1.5;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AegisLink is offline</h1>
      <p>The app shell was not cached yet on this device.</p>
      <p>Reconnect once to load the full app, then it can reopen offline and continue using local reports plus AegisMesh delivery when the network drops.</p>
    </main>
  </body>
</html>
